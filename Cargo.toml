[package]
name = "penna-frontend"
version = "0.1.2"
edition = "2021"

[dependencies]
gettext-rs = { version = "0.7", features = ["gettext-system"] }
gtk = { version = "0.9", package = "gtk4", features = ["gnome_47"] }
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
penna-engine = { git = "https://github.com/enfff/penna", tag = "v0.2.0" }

[dependencies.adw]
package = "libadwaita"
version = "0.7"
features = ["v1_6"]
