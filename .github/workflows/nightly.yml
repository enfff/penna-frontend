name: Nightly

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: New commits on develop?
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - name: Check
        id: check
        env:
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
        run: |
          # Manual dispatch always builds (explicit intent, or retry after a failure).
          if [[ "$EVENT" == "workflow_dispatch" ]]; then
            echo "manual dispatch, building"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          api() { curl -fsSL -H "Authorization: Bearer $GITHUB_TOKEN" "https://api.github.com$1"; }
          last_dev=$(api "/repos/$REPO/commits/develop" | jq -r '.commit.committer.date')
          last_run=$(api "/repos/$REPO/actions/workflows/nightly.yml/runs?status=success&per_page=1" | jq -r '.workflow_runs[0].updated_at // empty')
          if [[ -z "$last_run" ]]; then
            echo "no previous successful nightly, building"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif [[ "$last_dev" > "$last_run" ]]; then
            echo "develop ($last_dev) is newer than last nightly ($last_run), building"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "develop ($last_dev) unchanged since last nightly ($last_run), skipping"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  flatpak:
    name: Flatpak nightly (develop)
    runs-on: ubuntu-latest
    needs: check
    if: needs.check.outputs.changed == 'true'
    container:
      image: bilelmoussaoui/flatpak-github-actions:gnome-47
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - name: Stamp artifact name
        run: echo "ARTIFACT=diary-nightly-$(date -u +%Y%m%d)" >> "$GITHUB_ENV"

      - name: Generate devel manifest
        run: bash scripts/make-devel-manifest.sh

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: diary-nightly.flatpak
          manifest-path: io.github.enfff.Diary.Devel.json
          run-tests: true
          cache-key: flatpak-${{ env.ARTIFACT }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT }}
          path: diary-nightly.flatpak
          retention-days: 30
