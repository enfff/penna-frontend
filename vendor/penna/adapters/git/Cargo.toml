[package]
name = "penna-adapters-git"
version = "0.1.0"
edition = "2024"
description = "Git adapter for Penna journaling engine"
license = "UNLICENSED"

[dependencies]
penna-core = { version = "0.1.0", path = "../../core" }
git2 = "0.19"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
